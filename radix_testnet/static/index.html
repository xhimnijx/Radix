<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radix Testnet Wallet</title>
<style>
  :root {
    --bg:#0b0f14; --bg-2:#111823; --panel:#151d29; --panel-2:#1b2431;
    --line:#243040; --ink:#e8eef6; --dim:#8b9bb0; --accent:#4c9aff;
    --accent-ink:#04121f; --good:#3fb950; --warn:#d29922; --bad:#f85149;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  [data-theme="light"] {
    --bg:#f4f6fa; --bg-2:#e9eef6; --panel:#ffffff; --panel-2:#f0f4fa;
    --line:#d6dfeb; --ink:#101923; --dim:#5d6b7d; --accent:#1667d6;
    --accent-ink:#ffffff; --good:#1a7f37; --warn:#9a6700; --bad:#b42318;
    --shadow:0 8px 24px rgba(16,25,35,.10);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display:grid; grid-template-columns:236px 1fr; min-height:100vh; }

  /* ---------------------------------------------------------------- nav */
  aside { background:var(--bg-2); border-right:1px solid var(--line); padding:20px 14px;
          display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh; }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 8px 18px; }
  .mark { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--accent),#8b5cf6);
          display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px; }
  .brand b { font-size:15px; letter-spacing:.02em; }
  .brand small { display:block; color:var(--dim); font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
  nav { display:flex; flex-direction:column; gap:2px; }
  nav button { all:unset; display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
               color:var(--dim); cursor:pointer; font-size:14px; }
  nav button:hover { background:var(--panel); color:var(--ink); }
  nav button[aria-current="page"] { background:var(--panel); color:var(--ink); box-shadow:inset 2px 0 0 var(--accent); }
  nav .ico { width:18px; text-align:center; opacity:.9; }
  aside .foot { margin-top:auto; font-size:11px; color:var(--dim); padding:10px 8px; line-height:1.5; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; padding:0 8px 14px; }
  .badge { font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px;
           border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .badge.warn { color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .badge.bad  { color:var(--bad);  border-color:color-mix(in srgb, var(--bad) 40%, var(--line)); }
  .badge.ok   { color:var(--good); border-color:color-mix(in srgb, var(--good) 40%, var(--line)); }

  /* ---------------------------------------------------------------- main */
  main { padding:26px clamp(16px, 4vw, 40px) 60px; max-width:1120px; width:100%; }
  .page-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px;
               margin-bottom:20px; flex-wrap:wrap; }
  h1 { font-size:24px; margin:0; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:13px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px;
          box-shadow:var(--shadow); }
  .grid { display:grid; gap:16px; }
  .cols-2 { grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); }
  .cols-4 { grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); }
  .stat .k { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.1em; }
  .stat .v { font-size:26px; font-weight:650; margin-top:4px; letter-spacing:-.02em; }
  .stat .h { color:var(--dim); font-size:12px; margin-top:2px; }

  .balance { display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; }
  .balance .amount { font-size:40px; font-weight:700; letter-spacing:-.03em; line-height:1; }
  .balance .unit { color:var(--dim); font-size:13px; padding-bottom:6px; }
  .actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }

  button.btn { all:unset; cursor:pointer; padding:10px 16px; border-radius:10px; font-weight:600;
               background:var(--accent); color:var(--accent-ink); text-align:center; }
  button.btn:hover { filter:brightness(1.08); }
  button.btn:disabled { opacity:.45; cursor:not-allowed; filter:none; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid color-mix(in srgb, var(--accent) 55%, var(--line)); }
  button.subtle { background:var(--panel-2); color:var(--ink); border:1px solid var(--line); }
  button.tiny { padding:6px 10px; font-size:12px; border-radius:8px; }

  label.field { display:block; margin:14px 0 6px; color:var(--dim); font-size:11px;
                text-transform:uppercase; letter-spacing:.1em; }
  input, select, textarea { width:100%; font:inherit; color:var(--ink); background:var(--bg);
                border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .hint { color:var(--dim); font-size:12px; margin-top:8px; line-height:1.5; }
  .mono { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px;
          word-break:break-all; color:var(--dim); }
  .addrbox { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; }

  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
  tr:last-child td { border-bottom:0; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .pill.pending { background:color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn); }
  .pill.confirmed { background:color-mix(in srgb, var(--good) 18%, transparent); color:var(--good); }
  .pill.spent { background:color-mix(in srgb, var(--bad) 15%, transparent); color:var(--bad); }

  .empty { padding:34px 16px; text-align:center; color:var(--dim); font-size:13px; }
  .review { display:grid; gap:10px; }
  .review .line { display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px dashed var(--line); }
  .review .line:last-child { border-bottom:0; }
  .review .line b { font-weight:600; }
  .review .total { font-size:18px; }

  .progress { display:grid; gap:10px; }
  .bar { height:8px; border-radius:999px; background:var(--panel-2); overflow:hidden; }
  .bar span { display:block; height:100%; width:0%; background:linear-gradient(90deg, var(--accent), #8b5cf6);
              transition:width .4s ease; }
  .spinner { width:14px; height:14px; border:2px solid var(--accent); border-right-color:transparent;
             border-radius:50%; display:inline-block; animation:spin .9s linear infinite; vertical-align:-2px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .qr { background:#fff; border-radius:12px; padding:10px; display:inline-block; line-height:0; }
  .qr svg { width:190px; height:190px; }
  .split { display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:start; }
  .stack { display:grid; gap:8px; }
  .acct { display:flex; align-items:center; justify-content:space-between; gap:12px;
          padding:12px; border:1px solid var(--line); border-radius:10px; }
  .acct + .acct { margin-top:8px; }
  .acct .who { display:flex; align-items:center; gap:10px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--good); }
  .dot.spent { background:var(--bad); }
  .dot.zero { background:var(--dim); }

  #toasts { position:fixed; right:18px; bottom:18px; display:grid; gap:8px; z-index:50; max-width:380px; }
  .toast { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
           border-radius:10px; padding:11px 14px; box-shadow:var(--shadow); font-size:13px;
           animation:slide .18s ease-out; }
  .toast.ok { border-left-color:var(--good); }
  .toast.err { border-left-color:var(--bad); }
  @keyframes slide { from { transform:translateY(8px); opacity:0; } }

  dialog { border:1px solid var(--line); background:var(--panel); color:var(--ink);
           border-radius:14px; padding:22px; max-width:520px; width:92vw; box-shadow:var(--shadow); }
  dialog::backdrop { background:rgba(3,7,12,.62); }

  @media (max-width:860px) {
    body { grid-template-columns:1fr; }
    aside { position:fixed; bottom:0; top:auto; height:auto; width:100%; flex-direction:row;
            border-right:0; border-top:1px solid var(--line); padding:8px; z-index:40; }
    aside .brand, aside .badges, aside .foot { display:none; }
    nav { flex-direction:row; width:100%; justify-content:space-around; }
    nav button { flex-direction:column; font-size:10px; gap:3px; padding:6px; }
    main { padding-bottom:110px; }
    .split { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <div class="mark">R</div>
    <div><b>Radix</b><small>Testnet wallet</small></div>
  </div>
  <div class="badges">
    <span class="badge warn">testnet</span>
    <span class="badge bad">no value</span>
    <span class="badge bad">no security claim</span>
  </div>
  <nav id="nav">
    <button data-view="wallet"><span class="ico">◈</span>Wallet</button>
    <button data-view="send"><span class="ico">↗</span>Send</button>
    <button data-view="receive"><span class="ico">↙</span>Receive</button>
    <button data-view="history"><span class="ico">≡</span>History</button>
    <button data-view="book"><span class="ico">☆</span>Address book</button>
    <button data-view="settings"><span class="ico">⚙</span>Settings</button>
  </nav>
  <div class="foot">
    Local harness for the Candidate-B proof.<br>
    Not a cryptocurrency.<br>
    <span id="conn">connecting…</span>
  </div>
</aside>

<main id="main"></main>
<div id="toasts"></div>

<dialog id="modal"><div id="modalBody"></div></dialog>

<script>
"use strict";

const api = {
  async get(path) {
    const response = await fetch(path, { cache: "no-store" });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || response.statusText);
    return data;
  },
  async post(path, body) {
    const response = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || response.statusText);
    return data;
  },
};

const state = {
  view: "wallet",
  status: null,
  accounts: [],
  history: [],
  addressbook: [],
  settings: {},
  send: { to: "", amount: "100", fee: "10", stage: "form", elapsed: 0, result: null },
  receiveAccount: 0,
  timer: null,
};

/* ------------------------------------------------------------------ utils */
const $ = (sel) => document.querySelector(sel);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]
));
const short = (value, head = 10, tail = 6) =>
  value.length <= head + tail + 1 ? value : `${value.slice(0, head)}…${value.slice(-tail)}`;
const num = (value) => Number(value).toLocaleString("en-GB");

function toast(message, kind = "") {
  const node = document.createElement("div");
  node.className = `toast ${kind}`;
  node.textContent = message;
  $("#toasts").append(node);
  setTimeout(() => node.remove(), 6000);
}

function setView(view) {
  state.view = view;
  for (const button of document.querySelectorAll("#nav button")) {
    button.setAttribute("aria-current", button.dataset.view === view ? "page" : "false");
  }
  render();
}

/* ------------------------------------------------------------------ data */
async function refresh() {
  try {
    const [status, accounts, history, book, settings] = await Promise.all([
      api.get("/api/status"),
      api.get("/api/accounts"),
      api.get("/api/history"),
      api.get("/api/addressbook"),
      api.get("/api/settings"),
    ]);
    state.status = status;
    state.accounts = accounts.accounts;
    state.history = history.history;
    state.addressbook = book.addressbook;
    state.settings = settings.settings || {};
    $("#conn").textContent = `connected · height ${status.height}`;
    $("#conn").className = "badge ok";
    if (state.view === "wallet" || state.view === "history") render();
    if (state.view === "receive" && !$("#qrHost")) render();
  } catch (error) {
    $("#conn").textContent = "node unreachable";
    $("#conn").className = "badge bad";
  }
}

/* ------------------------------------------------------------------ views */
function viewWallet() {
  const status = state.status;
  const accounts = state.accounts;
  return `
    <div class="page-head">
      <div>
        <h1>Wallet</h1>
        <div class="sub">Four accounts from one seed. Each account is spendable once —
          the tag belongs to the key, not the note.</div>
      </div>
      <span class="badge warn">height ${status.height}</span>
    </div>
    <div class="grid cols-2">
      <section class="card">
        <div class="balance">
          <span class="amount">${num(status.faucet.balance)}</span>
          <span class="unit">testnet units</span>
        </div>
        <div class="sub" style="margin-top:6px">across ${accounts.filter(a => a.balance > 0).length} funded account(s)</div>
        <div class="actions">
          <button class="btn" data-go="send">Send</button>
          <button class="btn ghost" data-go="receive">Receive</button>
          <button class="btn subtle" id="mineBtn">Mine mempool</button>
        </div>
        <div class="hint">${status.mempool} transaction(s) waiting. Mining settles them into a block.</div>
      </section>
      <section class="card">
        <div class="stat"><div class="k">chain</div>
          <div class="v">${status.height}</div>
          <div class="h">blocks · ${status.outputs} outputs · ${status.pool} ring keys</div></div>
        <div class="mono" style="margin-top:10px">tip ${esc(short(status.tip, 16, 10))}</div>
        <div class="mono">q ${status.parameters.q} · depth ${status.parameters.depth} · ring ${num(status.parameters.ring)} · k′ ${status.parameters.tag_rows}</div>
        <div class="mono">backend ${esc(status.backend)}</div>
      </section>
    </div>
    <section class="card" style="margin-top:16px">
      <div class="page-head" style="margin-bottom:8px"><h1 style="font-size:16px">Accounts</h1></div>
      ${accounts.map((account) => `
        <div class="acct">
          <div class="who">
            <span class="dot ${account.spent ? "spent" : account.balance ? "" : "zero"}"></span>
            <div>
              <div><b>${esc(account.name)}</b>
                ${account.spent ? '<span class="pill spent" style="margin-left:8px">spent</span>' : ""}</div>
              <div class="mono">${esc(account.short)}</div>
            </div>
          </div>
          <div style="text-align:right">
            <div><b>${num(account.balance)}</b></div>
            <div class="sub">${account.notes} note(s)</div>
          </div>
        </div>`).join("")}
    </section>`;
}

function viewSend() {
  const send = state.send;
  if (send.stage === "proving") {
    return `
      <div class="page-head"><div><h1>Signing</h1>
        <div class="sub">A real tagged ring signature over ${num(state.status.parameters.ring)} members.</div></div></div>
      <section class="card">
        <div class="progress">
          <div><span class="spinner"></span> <b id="elapsed">${send.elapsed}s</b> elapsed</div>
          <div class="bar"><span id="bar" style="width:${Math.min(96, (send.elapsed / 90) * 100)}%"></span></div>
          <div class="hint">This is CPU-bound proof generation in CPython: expect 60–120 seconds.
            The page will update the moment the node accepts it. Do not close the tab.</div>
        </div>
      </section>`;
  }
  if (send.stage === "done") {
    return `
      <div class="page-head"><div><h1>Submitted</h1>
        <div class="sub">The transaction is in the mempool. Mine a block to settle it.</div></div></div>
      <section class="card">
        <div class="review">
          <div class="line"><span>transaction</span><b class="mono">${esc(send.result.id)}</b></div>
          <div class="line"><span>amount</span><b>${num(send.result.amount)}</b></div>
          <div class="line"><span>fee</span><b>${num(send.result.fee)}</b></div>
        </div>
        <div class="actions">
          <button class="btn" id="mineBtn">Mine a block</button>
          <button class="btn ghost" data-go="wallet">Back to wallet</button>
        </div>
      </section>`;
  }
  const account = state.accounts[0] || { address: "" };
  return `
    <div class="page-head"><div><h1>Send</h1>
      <div class="sub">Pay a testnet address from the first funded account.</div></div></div>
    <div class="grid cols-2">
      <section class="card">
        <label class="field" for="to">Recipient address</label>
        <input id="to" value="${esc(send.to)}" placeholder="rtx1…" autocomplete="off" spellcheck="false">
        ${state.addressbook.length ? `
          <label class="field" for="bookPick">Or pick from the address book</label>
          <select id="bookPick">
            <option value="">—</option>
            ${state.addressbook.map((entry) => `<option value="${esc(entry.address)}">${esc(entry.name)}</option>`).join("")}
          </select>` : ""}
        <div class="row">
          <div><label class="field" for="amount">Amount</label>
            <input id="amount" type="number" min="1" value="${esc(send.amount)}"></div>
          <div><label class="field" for="fee">Fee</label>
            <input id="fee" type="number" min="0" value="${esc(send.fee)}"></div>
        </div>
        <div class="actions"><button class="btn" id="reviewBtn">Review</button></div>
        <div class="hint">Nothing is signed until you confirm on the next screen.</div>
      </section>
      <section class="card">
        <div class="stat"><div class="k">available</div>
          <div class="v">${num(state.status.faucet.balance)}</div>
          <div class="h">from the node's faucet wallet</div></div>
        <div class="mono" style="margin-top:12px">${esc(account.address)}</div>
        <div class="hint">Addresses are full lattice public keys, so they are long. Copy, do not retype.</div>
      </section>
    </div>`;
}

function viewReceive() {
  const account = state.accounts[state.receiveAccount] || state.accounts[0];
  if (!account) return `<div class="empty">no accounts</div>`;
  return `
    <div class="page-head"><div><h1>Receive</h1>
      <div class="sub">Share this address to be paid. Testnet units only.</div></div></div>
    <section class="card">
      <div class="split">
        <div class="qr" id="qrHost"><svg xmlns="http://www.w3.org/2000/svg"></svg></div>
        <div class="stack">
          <label class="field" for="acctPick">Account</label>
          <select id="acctPick">
            ${state.accounts.map((entry) => `
              <option value="${entry.index}" ${entry.index === account.index ? "selected" : ""}>
                ${esc(entry.name)} — ${num(entry.balance)}
              </option>`).join("")}
          </select>
          <label class="field">Address</label>
          <div class="addrbox mono" id="addrText">${esc(account.address)}</div>
          <div class="actions">
            <button class="btn subtle tiny" id="copyBtn">Copy address</button>
          </div>
          <div class="hint">QR codes are generated locally by the node. No third-party service
            sees this address.</div>
        </div>
      </div>
    </section>`;
}

function viewHistory() {
  const rows = state.history;
  return `
    <div class="page-head"><div><h1>History</h1>
      <div class="sub">Confirmed transactions come from blocks; pending ones from the mempool.</div></div></div>
    <section class="card">
      ${rows.length ? `<table>
        <thead><tr><th>status</th><th>id</th><th>block</th><th>value</th><th>fee</th></tr></thead>
        <tbody>${rows.map((entry) => `
          <tr>
            <td><span class="pill ${entry.status}">${entry.status}</span></td>
            <td class="mono">${esc(entry.id)}</td>
            <td>${entry.height === null ? "—" : entry.height}</td>
            <td>${num(entry.value)}</td>
            <td>${num(entry.fee)}</td>
          </tr>`).join("")}</tbody></table>`
        : `<div class="empty">No transactions yet. Send one, or mine the mempool.</div>`}
    </section>`;
}

function viewBook() {
  return `
    <div class="page-head"><div><h1>Address book</h1>
      <div class="sub">Saved locally in the node's data directory.</div></div></div>
    <div class="grid cols-2">
      <section class="card">
        <label class="field" for="bookName">Name</label>
        <input id="bookName" placeholder="Alice" autocomplete="off">
        <label class="field" for="bookAddress">Address</label>
        <input id="bookAddress" placeholder="rtx1…" autocomplete="off" spellcheck="false">
        <div class="actions"><button class="btn" id="bookSave">Save contact</button></div>
      </section>
      <section class="card">
        ${state.addressbook.length ? state.addressbook.map((entry) => `
          <div class="acct">
            <div><b>${esc(entry.name)}</b><div class="mono">${esc(short(entry.address, 18, 10))}</div></div>
            <button class="btn subtle tiny" data-use="${esc(entry.address)}">Send</button>
          </div>`).join("")
          : `<div class="empty">No contacts yet.</div>`}
      </section>
    </div>`;
}

function viewSettings() {
  const theme = document.documentElement.dataset.theme;
  return `
    <div class="page-head"><div><h1>Settings</h1>
      <div class="sub">Stored in the node's data directory alongside the chain.</div></div></div>
    <div class="grid cols-2">
      <section class="card">
        <label class="field">Appearance</label>
        <div class="actions" style="margin-top:0">
          <button class="btn ${theme === "dark" ? "" : "subtle"}" data-theme="dark">Dark</button>
          <button class="btn ${theme === "light" ? "" : "subtle"}" data-theme="light">Light</button>
        </div>
        <label class="field">Refresh interval</label>
        <select id="refreshPick">
          <option value="2000">Every 2 seconds</option>
          <option value="3000">Every 3 seconds</option>
          <option value="5000">Every 5 seconds</option>
        </select>
      </section>
      <section class="card">
        <div class="stat"><div class="k">node</div><div class="v" style="font-size:16px">${esc(location.origin)}</div>
          <div class="h">single local process · no peers</div></div>
        <div class="stats" style="margin-top:12px">
          <div class="mono">backend ${esc(state.status.backend)}</div>
          <div class="mono">q = ${state.status.parameters.q}</div>
          <div class="mono">ring = ${num(state.status.parameters.ring)} · k′ = ${state.status.parameters.tag_rows}</div>
        </div>
        <div class="hint" style="margin-top:14px">
          This wallet cannot make you safe: the cryptography under it is unaudited and makes
          no security claim. It exists so the proof can be exercised end to end.
        </div>
      </section>
    </div>`;
}

const VIEWS = {
  wallet: viewWallet, send: viewSend, receive: viewReceive,
  history: viewHistory, book: viewBook, settings: viewSettings,
};

function render() {
  const host = $("#main");
  const scroll = window.scrollY;
  host.innerHTML = VIEWS[state.view]();
  wire();
  window.scrollTo(0, scroll);
}

/* ------------------------------------------------------------------ actions */
function wire() {
  for (const button of document.querySelectorAll("[data-go]")) {
    button.onclick = () => setView(button.dataset.go);
  }
  const mineBtn = $("#mineBtn");
  if (mineBtn) mineBtn.onclick = mine;
  const reviewBtn = $("#reviewBtn");
  if (reviewBtn) reviewBtn.onclick = review;
  const bookSave = $("#bookSave");
  if (bookSave) bookSave.onclick = saveContact;
  for (const button of document.querySelectorAll("[data-use]")) {
    button.onclick = () => { state.send.to = button.dataset.use; setView("send"); };
  }
  for (const button of document.querySelectorAll("[data-theme]")) {
    button.onclick = () => applyTheme(button.dataset.theme);
  }
  const acctPick = $("#acctPick");
  if (acctPick) acctPick.onchange = () => { state.receiveAccount = Number(acctPick.value); render(); };
  const copyBtn = $("#copyBtn");
  if (copyBtn) copyBtn.onclick = async () => {
    const text = $("#addrText").textContent;
    try { await navigator.clipboard.writeText(text); toast("Address copied", "ok"); }
    catch { toast("Select the address and copy it manually", "err"); }
  };
  const bookPick = $("#bookPick");
  if (bookPick) bookPick.onchange = () => { if (bookPick.value) { $("#to").value = bookPick.value; state.send.to = bookPick.value; } };
  const refreshPick = $("#refreshPick");
  if (refreshPick) refreshPick.onchange = () => toast("Refresh interval saved for this session");
  if (state.view === "receive") loadQr();
}

async function loadQr() {
  const account = state.accounts[state.receiveAccount] || state.accounts[0];
  if (!account) return;
  try {
    const response = await fetch(`/api/qr?text=${encodeURIComponent(account.address)}`);
    if (!response.ok) throw new Error("qr failed");
    const svg = await response.text();
    const host = $("#qrHost");
    if (host) host.innerHTML = svg;
  } catch {
    const host = $("#qrHost");
    if (host) host.innerHTML = '<div class="hint" style="width:190px">QR unavailable</div>';
  }
}

function review() {
  const to = $("#to").value.trim();
  const amount = parseInt($("#amount").value, 10);
  const fee = parseInt($("#fee").value, 10);
  if (!to) return toast("Enter a recipient address", "err");
  if (!Number.isFinite(amount) || amount <= 0) return toast("Enter a positive amount", "err");
  if (!Number.isFinite(fee) || fee < 0) return toast("Enter a valid fee", "err");
  if (amount + fee > state.status.faucet.balance) return toast("Not enough testnet units", "err");

  state.send = { to, amount: String(amount), fee: String(fee), stage: "review", elapsed: 0, result: null };
  $("#modalBody").innerHTML = `
    <h1 style="font-size:18px;margin:0 0 4px">Confirm payment</h1>
    <div class="sub" style="margin-bottom:14px">This will generate a real proof.</div>
    <div class="review">
      <div class="line"><span>to</span><b class="mono">${esc(short(to, 16, 10))}</b></div>
      <div class="line"><span>amount</span><b>${num(amount)}</b></div>
      <div class="line"><span>fee</span><b>${num(fee)}</b></div>
      <div class="line total"><span>total</span><b>${num(amount + fee)}</b></div>
    </div>
    <div class="hint">Signing takes 60–120 seconds. You can watch it happen.</div>
    <div class="actions" style="justify-content:flex-end">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn" id="confirmBtn">Confirm &amp; sign</button>
    </div>`;
  const modal = $("#modal");
  modal.showModal();
  $("#cancelBtn").onclick = () => modal.close();
  $("#confirmBtn").onclick = () => { modal.close(); submit(); };
}

async function submit() {
  const { to, amount, fee } = state.send;
  state.send.stage = "proving";
  state.send.elapsed = 0;
  setView("send");
  clearInterval(state.timer);
  state.timer = setInterval(() => {
    state.send.elapsed += 1;
    const elapsed = $("#elapsed");
    const bar = $("#bar");
    if (elapsed) elapsed.textContent = `${state.send.elapsed}s`;
    if (bar) bar.style.width = `${Math.min(96, (state.send.elapsed / 90) * 100)}%`;
  }, 1000);

  try {
    const result = await api.post("/api/send", { to, amount: Number(amount), fee: Number(fee) });
    state.send = { ...state.send, stage: "done", result };
    toast("Transaction submitted to the mempool", "ok");
    refresh();
  } catch (error) {
    state.send.stage = "form";
    toast(error.message, "err");
  } finally {
    clearInterval(state.timer);
    render();
  }
}

async function mine() {
  try {
    const block = await api.post("/api/mine", {});
    toast(`Block ${block.height} mined with ${block.transactions} transaction(s)`, "ok");
  } catch (error) {
    toast(error.message, "err");
  }
  refresh();
}

async function saveContact() {
  const name = $("#bookName").value.trim();
  const address = $("#bookAddress").value.trim();
  if (!name || !address) return toast("Name and address are both required", "err");
  try {
    await api.post("/api/addressbook", { name, address });
    toast("Contact saved", "ok");
    refresh().then(render);
  } catch (error) {
    toast(error.message, "err");
  }
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("radix-theme", theme); } catch { /* private mode */ }
  api.post("/api/settings", { theme }).catch(() => {});
  render();
}

/* ------------------------------------------------------------------ boot */
for (const button of document.querySelectorAll("#nav button")) {
  button.onclick = () => setView(button.dataset.view);
}

document.addEventListener("keydown", (event) => {
  if (event.target.matches("input, select, textarea")) return;
  const keys = { s: "send", r: "receive", h: "history", w: "wallet", b: "book", ",": "settings" };
  if (keys[event.key]) { event.preventDefault(); setView(keys[event.key]); }
  if (event.key === "Escape") $("#modal").close();
  if (event.key === "m") { event.preventDefault(); mine(); }
});

try {
  const saved = localStorage.getItem("radix-theme");
  if (saved) document.documentElement.dataset.theme = saved;
} catch { /* private mode */ }

refresh().then(render);
setInterval(refresh, 3000);
</script>
</body>
</html>
