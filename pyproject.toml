[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radix-core"
version = "0.1.0"
description = "Experimental, non-value research prototype: a post-quantum private payment network (Candidate B, lattice ring signatures)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.2",
  "segno>=1.6",  # QR codes, pure Python, no transitive deps
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["radix_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: runs the real set-membership protocol (~20 s per proof); use -m 'not slow' for a fast loop",
]
