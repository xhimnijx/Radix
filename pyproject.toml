[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radix-candidate-a-reference-core"
version = "0.1.0"
description = "Experimental, non-value Candidate-A reference core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["radix_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: runs the real set-membership protocol (~20 s per proof); use -m 'not slow' for a fast loop",
]
