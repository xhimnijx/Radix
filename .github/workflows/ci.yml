name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The full suite runs the real set-membership protocol (~7 min here,
          # slower on runners), so only one interpreter pays for it. The others
          # still cover everything that does not depend on a 20 s proof.
          - python-version: "3.11"
            pytest-args: '-m "not slow"'
          - python-version: "3.12"
            pytest-args: '-m "not slow"'
          - python-version: "3.13"
            pytest-args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q ${{ matrix.pytest-args }}
      - name: Standalone vectors
        run: |
          python archive/candidate-a/Radix-Serialization-Test-Vectors.py
          python archive/candidate-a/Radix-Gate-1-Reference-Model.py
      - name: Wallet demo
        run: python -m examples.wallet_note_demo > /dev/null

  rust:
    name: rust (archived Candidate-A harness - build, lint, non-ignored tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/candidate-a/proof_harness
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: archive/candidate-a/proof_harness
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Test (proof-heavy tests are #[ignore]d by design)
        run: cargo test --locked

  launch-gate:
    name: launch gate is closed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Assert mainnet remains locked
        run: python -c "from radix_core.launch import MAINNET_SWITCH; assert not MAINNET_SWITCH.is_open, MAINNET_SWITCH.describe_refusals(); print('mainnet gate closed:', MAINNET_SWITCH.describe_refusals())"
