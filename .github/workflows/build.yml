name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: fast suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: fast tests
        run: python -m pytest -q -m "not slow"
      - name: rust arithmetic
        run: |
          cd proof_rust
          cargo test --offline || cargo test

  package:
    # PyInstaller cannot cross-compile. Each artefact is built on its own runner,
    # which is the only way to get a macOS binary that actually runs on macOS.
    name: package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RadixTestnet-windows
          - os: macos-latest
            artifact: RadixTestnet-macos
          - os: ubuntu-latest
            artifact: RadixTestnet-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: build
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/radix-testnet.spec
      - name: smoke test the artefact
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows) BIN="dist/RadixTestnet.exe" ;;
            *)       BIN="dist/RadixTestnet" ;;
          esac
          test -f "$BIN"
          "$BIN" --no-browser --port 8666 --data-dir "$RUNNER_TEMP/radix" &
          PID=$!
          sleep 8
          python - <<'PY'
          import json, urllib.request, sys
          status = json.load(urllib.request.urlopen("http://127.0.0.1:8666/api/status"))
          assert status["faucet"]["balance"] > 0, status
          print("artefact served:", status["height"], status["faucet"]["balance"])
          PY
          kill $PID || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
